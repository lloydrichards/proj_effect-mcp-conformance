name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, format, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run type-check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build

  conformance:
    name: Full conformance matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run conformance
        shell: bash
        run: |
          mkdir -p .cache/conformance
          set -o pipefail
          bun run conformance:all --timeout 30000 2>&1 | tee .cache/conformance/matrix.log
      - name: Upload conformance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/conformance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
